<!DOCTYPE html>
<html>
<head>
    <title>Add Bill - SpendingBuddy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='pages.css') }}">
</head>
<body>
    <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">
        <span></span>
        <span></span>
    </button>
<div class="mobile-overlay" id="mobileOverlay"></div>
    <div class = "container">
        <div class = "left">
            <div>
                <h1 style="color: #F8FAFC;">SpendingBuddy</h1>
                <hr class="sidebar-line"style="border: 1px solid #60A5FA;"width="100%">
                <nav class = "menu">
                    <div class = "menu-item">
                        <a href="/">Dashboard</a>
                    </div>
                    <div class = "menu-item">
                        <a href="/add-expense">Add Expense</a>
                    </div>
                    <div class = "menu-item">
                        <a href = "/expenses">View Expenses</a>
                    </div>
                    <div class = "menu-item">
                        <a href = "/reports">Reports</a>
                    </div>
                    <div class = "menu-item">
                        <a href = "/bills">Bills</a>
                    </div>
                </nav>
            </div>
            <div class = "account">
                <div class="logo">
                    <a href = "/account">
                       <img src="{{ url_for('static', filename='account_logo.png') }}" alt="logo">
                       </a>
                </div>
                <div class="text">
                    <a href = "/account">Account</a>
                </div>
            </div>   
        </div>     
    
        <div class = "right">

            <h1 class="title">Add Bill</h1>

            <form method="POST" id="billForm">

                <label>Bill Name:</label><br>
                <input type="text" name="bill_name" required><br><br>

                <label>Amount:</label><br>
                <input type="number" step="0.01" name="amount" required><br><br>

                <label>Due Date:</label><br>
                <input type="date" name="due_date" required><br><br>

                <button type="submit">Save Bill</button>

            </form>

            <br>
            <a href="/bills" style="padding-left: 800px;">View Bills</a>
        </div>
    </div>

    <!-- Popup -->
    <div id="popupOverlay" class="popup-overlay">
        <div class="popup-box">
            <p>Bill saved successfully!</p>
            <button onclick="closePopup()">OK</button>
        </div>
    </div>

    <script>
        const form = document.getElementById('billForm');

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            const formData = new FormData(form);

            const response = await fetch('/add-bill', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                document.getElementById('popupOverlay').style.display = 'flex';
                form.reset();
            } else {
                alert('Something went wrong. Please try again.');
            }
        });

        function closePopup() {
            document.getElementById('popupOverlay').style.display = 'none';
        }

        const menuBtn = document.getElementById("mobileMenuBtn");
        const sidebar = document.querySelector(".left");
        const overlay = document.getElementById("mobileOverlay");

        function openSidebar() {
            sidebar.classList.add("sidebar-open");
            overlay.classList.add("overlay-active");
        }

        function closeSidebar() {
            sidebar.classList.remove("sidebar-open");
            overlay.classList.remove("overlay-active");
        }

        menuBtn.addEventListener("click", function () {

            if (sidebar.classList.contains("sidebar-open")) {
                closeSidebar();
            } else {
                openSidebar();
            }

        });

        overlay.addEventListener("click", closeSidebar);


        /* =========================
        SWIPE DETECTION
        ========================= */

        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener("touchstart", function(event) {

            touchStartX = event.touches[0].clientX;

        });


    document.addEventListener("touchend", function(event) {

        touchEndX = event.changedTouches[0].clientX;

        const swipeDistance = touchEndX - touchStartX;


        /* Swipe from left to right */
        if (touchStartX < 40 && swipeDistance > 70) {
            openSidebar();
        }


        /* Swipe from right to left */
        if (swipeDistance < -70 && sidebar.classList.contains("sidebar-open")) {
            closeSidebar();
        }

    });
    </script>
</body>
</html>
